services:
  - type: web
    name: study-dashboards
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      # Optional: Google sign-in + cloud sync (see README "Accounts"). Leave empty to stay anonymous-only.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
